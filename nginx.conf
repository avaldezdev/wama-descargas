# Descargas WAMA — nginx para hosting propio (Coolify/Docker).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # La página solo consulta la API de GitHub (versión y novedades). Las descargas son
    # navegación a github.com, que la CSP no restringe.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com; frame-ancestors 'none';" always;

    # Detrás de un proxy, mantener el esquema https en las redirecciones.
    absolute_redirect off;

    # Atajos fáciles de dictar por teléfono/WhatsApp.
    location = /printagent  { return 301 /print-agent; }
    location = /impresion   { return 301 /print-agent; }

    # Enlace directo al último APK (para el aviso de la app o para pasar por WhatsApp).
    location = /print-agent/apk {
        return 302 https://github.com/avaldezdev/wama-print-agent-releases/releases/latest/download/PrintAgent.apk;
    }

    # Atajos a la página de Windows.
    location = /print-agent/windows { return 301 /print-agent-windows; }
    location = /windows             { return 301 /print-agent-windows; }

    location ~* \.(css|js|png|svg|ico|webp)$ {
        expires 1h;
        try_files $uri =404;
    }

    location ~* \.pdf$ {
        expires 1h;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # URLs limpias: /print-agent → print-agent.html
    location / {
        expires 5m;
        try_files $uri $uri.html $uri/ =404;
    }
}
